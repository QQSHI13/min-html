[package]
name = "min-html-common"
description = "Common code and data for min-html*"
license = "MIT"
homepage = "https://github.com/QQSHI13/min-html"
repository = "https://github.com/QQSHI13/min-html.git"
version = "0.0.4"
authors = ["QQSHI13"]
edition = "2018"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
ahash = "0.8"
aho-corasick = "1.1"
memchr = "2"
once_cell = "1.21"

[build-dependencies]
itertools = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
