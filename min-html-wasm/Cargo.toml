[package]
name = "index"
publish = false
version = "0.18.4"
authors = ["QQSHI13"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
js-sys = "0.3"
min-html = { path = "../min-html" }
wasm-bindgen = "0.2"
# We don't use this dep directly, but it's transitive, and we must enable "wasm_js" feature to use with WASM.
getrandom = { version = "0.3", features = ["wasm_js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# https://github.com/WebAssembly/wasi-sdk/issues/254
# https://github.com/rust-lang/rust/issues/137315
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]
[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["-O", "--all-features"]
