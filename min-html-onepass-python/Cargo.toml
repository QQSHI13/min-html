[package]
publish = false
name = "min-html-onepass-python"
description = "Even faster version of min-html"
license = "MIT"
homepage = "https://github.com/QQSHI13/min-html"
readme = "README.md"
repository = "https://github.com/QQSHI13/min-html.git"
version = "0.18.2"
authors = ["QQSHI13"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
min-html-onepass = { path = "../min-html-onepass" }
pyo3 = { "version" = "0.29", features = ["extension-module", "generate-import-lib"] }
