name: Build and publish WASM package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo ${GITHUB_REF#refs/tags/v} || echo '0.0.0')" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build native module
        working-directory: ./min-html-wasm
        shell: bash
        run: TARGET=bundler ./build

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Publish package
        working-directory: ./min-html-wasm/pkg
        shell: bash
        run: |
          # npm refuses to work with symlinks.
          cp ../../README.md .
          if [[ "${{ steps.version.outputs.VERSION }}" != "0.0.0" ]]; then
            npm publish --provenance --access public --registry https://registry.npmjs.org/
          fi
