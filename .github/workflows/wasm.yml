name: Build and publish WASM package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo ${GITHUB_REF#refs/tags/v} || echo '0.0.0')" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build native module
        working-directory: ./min-html-wasm
        shell: bash
        run: TARGET=bundler ./build

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org/

      - name: Pack and publish package
        working-directory: ./min-html-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          # npm refuses to work with symlinks.
          cp ../../README.md .
          if [[ "${{ steps.version.outputs.VERSION }}" != "0.0.0" ]]; then
            npm publish --access public
          fi
