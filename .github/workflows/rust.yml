name: Publish Rust crates to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cratesio
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish min-html-common
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          cargo publish -p min-html-common 2>&1 | tee /tmp/publish.log
          if [[ ${PIPESTATUS[0]} -ne 0 ]] && ! grep -q "already exists" /tmp/publish.log; then
            exit 1
          fi

      - name: Publish min-html
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          cargo publish -p min-html 2>&1 | tee /tmp/publish.log
          if [[ ${PIPESTATUS[0]} -ne 0 ]] && ! grep -q "already exists" /tmp/publish.log; then
            exit 1
          fi

      - name: Publish min-html-onepass
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          cargo publish -p min-html-onepass 2>&1 | tee /tmp/publish.log
          if [[ ${PIPESTATUS[0]} -ne 0 ]] && ! grep -q "already exists" /tmp/publish.log; then
            exit 1
          fi

      - name: Publish minhtml-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          cargo publish -p minhtml-cli 2>&1 | tee /tmp/publish.log
          if [[ ${PIPESTATUS[0]} -ne 0 ]] && ! grep -q "already exists" /tmp/publish.log; then
            exit 1
          fi
