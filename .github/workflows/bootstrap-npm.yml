name: Bootstrap npm packages (one-off token-based)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-13
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cross compiler
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: sudo apt install -y gcc-aarch64-linux-gnu

      - name: Build native module
        working-directory: ./min-html-nodejs
        shell: bash
        run: |
          npm install
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc
          npm run build-release -- --target ${{ matrix.target }}
          mv -v index.node plat-pkg/.
          TARGET=${{ matrix.target }} node plat-pkg/package.json.gen.js

      - name: Publish native package
        working-directory: ./min-html-nodejs/plat-pkg
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN_BOOTSTRAP }}
        run: |
          npm config set //registry.npmjs.org/:_authToken="${NODE_AUTH_TOKEN}"
          npm publish --access public

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Prepare package
        working-directory: ./min-html-nodejs
        run: cp ../README.md .

      - name: Publish package
        working-directory: ./min-html-nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN_BOOTSTRAP }}
        run: |
          npm config set //registry.npmjs.org/:_authToken="${NODE_AUTH_TOKEN}"
          npm publish --access public
