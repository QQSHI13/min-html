name: Build and publish Java artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            buildfile: 'libmin_html_java.so'
            resfile: 'linux-aarch64.nativelib'

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            buildfile: 'libmin_html_java.so'
            resfile: 'linux-x64.nativelib'

          - target: aarch64-apple-darwin
            os: macos-latest
            buildfile: 'libmin_html_java.dylib'
            resfile: 'mac-aarch64.nativelib'

          - target: x86_64-apple-darwin
            os: macos-latest
            buildfile: 'libmin_html_java.dylib'
            resfile: 'mac-x64.nativelib'

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            buildfile: 'min_html_java.dll'
            resfile: 'win-x64.nativelib'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cross compiler
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: sudo apt install -y gcc-aarch64-linux-gnu

      - name: Build Java native library
        working-directory: ./min-html-java
        shell: bash
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc
          cargo build --release --target ${{ matrix.target }}
          # upload-artifact does not rename the file, so when we download if we don't rename all files will have the same name.
          mv -v ../target/${{ matrix.target }}/release/${{ matrix.buildfile }} ${{ matrix.resfile }}

      - name: Upload built library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.resfile }}
          path: min-html-java/${{ matrix.resfile }}

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/download-artifact@v8
        with:
          path: 'min-html-java/src/main/resources/'
          merge-multiple: true

      - name: Build, pack, and publish JAR
        working-directory: ./min-html-java
        env:
          SONATYPE_GPG_PRIVATE_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}
        run: |
          if [ -n "$MAVEN_GPG_PASSPHRASE" ]; then
            echo "$SONATYPE_GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase "$MAVEN_GPG_PASSPHRASE" --import
          else
            echo "$SONATYPE_GPG_PRIVATE_KEY" | gpg --batch --yes --allow-secret-key-import --import
          fi
          FINGERPRINT=$(gpg --list-secret-keys --with-colons --fingerprint | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -n "$FINGERPRINT" ]; then
            echo -e "5\ny\n" | gpg --batch --command-fd 0 --edit-key "$FINGERPRINT" trust quit
          fi
          mkdir -p "$HOME/.m2"
          cat << 'EOF' > "$HOME/.m2/settings.xml"
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_PORTAL_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_PORTAL_TOKEN }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>central</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
              </profile>
            </profiles>
          </settings>
          EOF
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(grep -oP '(?<=<version>)[^<]+' pom.xml | head -1)
            if ! curl -sf "https://repo1.maven.org/maven2/com/qqshi13/minhtml/min-html/${version}/min-html-${version}.jar" >/dev/null; then
              mvn clean deploy
            fi
          fi
