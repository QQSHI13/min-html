name: Build and publish Node.js package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cross compiler
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: sudo apt install -y gcc-aarch64-linux-gnu

      - name: Build native module
        working-directory: ./min-html-nodejs
        shell: bash
        run: |
          npm install
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc
          npm run build-release -- --target ${{ matrix.target }}
          mv -v index.node plat-pkg/.
          TARGET=${{ matrix.target }} node plat-pkg/package.json.gen.js

      - name: Install latest npm for OIDC provenance
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install -g npm@latest

      - name: Publish native package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./min-html-nodejs/plat-pkg
        shell: bash
        run: npm publish --provenance --access public --registry https://registry.npmjs.org/

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Prepare package
        working-directory: ./min-html-nodejs
        run: |
          # npm refuses to work with symlinks.
          cp ../README.md .

      - name: Install latest npm for OIDC provenance
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install -g npm@latest

      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./min-html-nodejs
        shell: bash
        run: npm publish --provenance --access public --registry https://registry.npmjs.org/
