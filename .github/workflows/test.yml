name: Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        shell: bash
        run: rustup toolchain install nightly --component rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        shell: bash
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        shell: bash
        run: cargo clippy -p minify-html -p minify-html-common -p minify-html-onepass --all-targets --all-features -- -D warnings

      - name: Run tests
        shell: bash
        run: cargo test -p minify-html -p minify-html-common -p minify-html-onepass

      - name: Build CLI
        shell: bash
        run: cargo build -p minhtml
