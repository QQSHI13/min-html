name: Build and publish Ruby gem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# https://github.com/oxidize-rb/actions/tree/main/cross-gem
# https://github.com/gjtorikian/commonmarker/blob/main/.github/workflows/tag_and_release.yml
# https://github.com/yettoapp/actions/blob/main/.github/workflows/ruby_gem_release.yml

jobs:
  build:
    runs-on: ubuntu-latest
    environment: rubygems
    strategy:
      matrix:
        platform:
        - x86_64-linux
        - aarch64-linux
        - x86_64-darwin
        - arm64-darwin
        - x64-mingw-ucrt
    steps:
    - uses: actions/checkout@v7

    - name: Patches
      run: |
        # Name must match or else `RbSys::PackageNotFoundError: Could not find Cargo package metadata for nil. Please check that nil matches the crate name in your Cargo.toml.`
        # We edit it here instead of just updating our repo code as Cargo workspace names must be different.
        sed -i 's%^name = ".*$%name = "min_html"%' ./min-html-ruby/ext/min_html/Cargo.toml

        # rb-sys-dock doesn't support local path deps: https://github.com/oxidize-rb/rb-sys/issues/296
        ver=$(jq -r .version min-html-nodejs/package.json)
        sed -i 's%^min-html = .*$%min-html = "'$ver'"%' ./min-html-ruby/ext/min_html/Cargo.toml

        # This is required or else `error: could not find `Cargo.toml` in `/home/runner/work/.../min-html-ruby` or any parent directory`.
        cat <<'EOD'>./min-html-ruby/Cargo.toml
        [workspace]
        members = ["ext/min_html"]
        EOD

        cp ./README.md ./min-html-ruby/.

    - name: Set up Ruby and Rust
      uses: oxidize-rb/actions/setup-ruby-and-rust@v1.4.4
      with:
        ruby-version: "4.0"
        bundler-cache: false
        cargo-cache: true
        cargo-vendor: true
        cache-version: v0-${{ matrix.platform }}

    - name: Cross compile
      id: gem
      uses: oxidize-rb/actions/cross-gem@v1.4.4
      with:
        platform: ${{ matrix.platform }}
        ruby-versions: "3.3,3.4,4.0"
        working-directory: ./min-html-ruby

    - name: Configure RubyGems credentials
      if: startsWith(github.ref, 'refs/tags/v')
      uses: rubygems/configure-rubygems-credentials@main

    - name: Publish gem
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        version=$(grep -oP 'spec\.version\s*=\s*"\K[^"]+' min_html.gemspec)
        if ! gem list min_html -r -a 2>/dev/null | grep -qE "min_html \(.*${version}"; then
          gem push ${{ steps.gem.outputs.gem-path }}
        fi
