[package]
publish = false
name = "min-html-python"
description = "Extremely fast and smart HTML + JS + CSS minifier"
license = "MIT"
homepage = "https://github.com/QQSHI13/min-html"
readme = "README.md"
repository = "https://github.com/QQSHI13/min-html.git"
version = "0.18.4"
authors = ["QQSHI13"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
min-html = { path = "../min-html" }
pyo3 = { "version" = "0.29", features = ["extension-module", "generate-import-lib"] }
