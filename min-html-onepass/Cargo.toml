[package]
name = "min-html-onepass"
description = "Even faster version of min-html"
license = "MIT"
homepage = "https://github.com/QQSHI13/min-html"
readme = "README.md"
keywords = ["html", "compress", "minifier", "js", "css"]
categories = ["compression", "development-tools::build-utils", "web-programming"]
repository = "https://github.com/QQSHI13/min-html.git"
version = "0.18.1"
authors = ["Wilson Lin <code@wilsonl.in>"]
edition = "2018"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
ahash = "0.8"
aho-corasick = "1.1"
lightningcss = "1.0.0-alpha.68"
memchr = "2"
min-html-common = { version = "0.0.3", path = "../min-html-common" }
once_cell = "1.21"
oxc_allocator = "0.143"
oxc_codegen = "0.143"
oxc_minifier = "0.143"
oxc_parser = "0.143"
oxc_span = "0.143"
